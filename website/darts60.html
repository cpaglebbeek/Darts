<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Darts Game v1.17c (Wobble Fix)</title>
  <meta name="author" content="Christian Glebbeek, iCt Hrose">
  <meta name="copyright" content="Copyright Christian Glebbeek, iCt Hrose 2025. Alle rechten voorbehouden.">
  <style>
    /* ... (CSS is identiek aan v1.16c / v1.17c) ... */
    html, body { margin:0; height:100%; background:#0b0f14; color:#e7f0ff; font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial; overflow:hidden; }
    #wrap { position:fixed; inset:0; display:grid; grid-template-rows: auto 1fr auto; grid-template-columns: 1fr; display:none; }
    header { padding:8px 12px; background:#0f1620; border-bottom:1px solid #1c2633; z-index:11; transition: transform 0.3s ease-in-out; grid-column: 1 / -1; position: fixed; top: 0; left: 0; right: 0; }
    header.hidden-by-mouse { transform: translateY(-110%); }
    footer { padding:8px 12px; background:#0f1620; border-top:1px solid #1c2633; z-index:10; grid-column: 1 / -1; grid-row: 3; position: fixed; bottom: 0; left: 0; right: 0; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    button { appearance:none; border:none; padding:8px 10px; border-radius:10px; background:#1b2736; color:#e7f0ff; box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 1px 8px rgba(0,0,0,.25); cursor:pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    button:active { transform:translateY(1px); }
    .popup-button-primary { background: #10b981; padding: 14px 20px; font-size: 1.2em; }
    .popup-button-secondary { background: #7f1d1d; padding: 14px 20px; font-size: 1.2em; color: #fecaca; }
    #btnEndGame { background: #7f1d1d; color: #fecaca; }
    #btnUndo { background: #9a3412; color: #fdba74; }
    main { position: relative; grid-row: 2; grid-column: 1; padding-top: 50px; padding-bottom: 50px; box-sizing: border-box; }
    #canvas { position:absolute; top:0; left:0; width:100%; height:100%; display:block; touch-action:none; background:#000; cursor: none; z-index: 1; }
    #scoreboard { position: fixed; top: 56px; right: 12px; z-index: 10; display: block; background:rgba(20,24,30,.7); padding:15px 20px; border-radius:12px; font-family:'DSEG7', monospace; backdrop-filter: blur(8px); border:1px solid rgba(255,255,255,0.1); box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.05); min-width:240px; max-width: 300px; box-sizing: border-box; overflow-y: auto; transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out; }
    
    @media (max-width: 900px) {
      #wrap { grid-template-rows: auto 1fr auto; grid-template-columns: 1fr; }
      main { grid-row: 2; grid-column: 1; }
      #scoreboard { display: flex; flex-direction: row; flex-wrap: wrap; justify-content: flex-end; bottom: auto; max-width: calc(100vw - 24px); width: calc(100vw - 24px); left: 12px; right: 12px; overflow-y: hidden; overflow-x: auto; transform: translateY(-110%); opacity: 1; }
      #scoreboard.hidden-by-mouse { transform: translateY(-110%); opacity: 1; }
    }

    #scoreboard .player-section { background: #0d1016; padding: 10px 15px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #2a3340; box-shadow: inset 0 0 5px rgba(0,0,0,0.5); position: relative; flex-shrink: 0; width: 220px; }
    #scoreboard .player-name { color: #e7f0ff; font-size: 1.1em; margin-bottom: 5px; font-family: system-ui; }
    #scoreboard .nixie-score, #scoreboard .nixie-turn-score, #scoreboard .nixie-darts-remaining, #scoreboard .checkout-guide { font-family: 'DSEG7 Classic', monospace; font-size: 2.2em; color: #ff9900; text-shadow: 0 0 2px #ff9900, 0 0 10px #ff9900, 0 0 20px rgba(255,153,0,0.5); letter-spacing: 0.05em; background: #1a1e26; padding: 5px 8px; border-radius: 4px; display: inline-block; min-width: 60px; text-align: right; position: relative; overflow: hidden; }
    #scoreboard .nixie-score::before, #scoreboard .nixie-turn-score::before, #scoreboard .nixie-darts-remaining::before, #scoreboard .checkout-guide::before { content: attr(data-value); position: absolute; top: 0; left: 0; right: 0; bottom: 0; color: rgba(255,153,0,0.1); text-shadow: none; z-index: 1; opacity: 0.5; }
    #scoreboard .nixie-score span, #scoreboard .nixie-turn-score span, #scoreboard .nixie-darts-remaining span, #scoreboard .checkout-guide span { position: relative; z-index: 2; }
    #scoreboard .turn-details { margin-top: 8px; font-size: 0.9em; color: #aebacd; font-family: system-ui; }
    #scoreboard .turn-details .turn-score-label, #scoreboard .turn-details .darts-remaining-label { font-size: 0.8em; opacity: 0.7; }
    #scoreboard .message { margin-top: 15px; color: #ff0000; font-weight: bold; text-shadow: 0 0 5px #ff0000; font-family: system-ui; }
    #scoreboard .checkout-guide { font-size: 1.6em; min-width: 160px; text-align: center; margin-top: 5px; }
    #scoreboard .checkout-label { font-family: system-ui; font-size: 0.8em; opacity: 0.7; display: block; margin-top: 10px; text-align: center; }
    #scoreboard .manual-entry { display: flex; gap: 8px; margin-top: 10px; }
    #scoreboard .manual-entry input { width: 80px; background: #1a1e26; border: 1px solid #2a3340; color: #ff9900; font-family: 'DSEG7 Classic', monospace; font-size: 1.5em; text-align: right; padding: 5px; border-radius: 4px; }
    #scoreboard .manual-entry input::-webkit-outer-spin-button, #scoreboard .manual-entry input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    #scoreboard .manual-entry input[type=number] { -moz-appearance: textfield; }
    #scoreboard .manual-entry button { flex: 1; font-size: 1em; padding: 5px 10px; }
    
    #scoreboard .dart-throws {
      margin-top: 12px;
      margin-bottom: 8px;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 8px;
      font-family: system-ui;
      font-size: 0.9em;
      line-height: 1.5;
    }
    #scoreboard .dart-throw {
      display: flex;
      justify-content: space-between;
      padding: 2px 5px;
    }
    #scoreboard .dart-throw span:first-child {
      opacity: 0.7;
    }
    #scoreboard .dart-throw span:last-child {
      font-weight: bold;
      color: #f59e0b; 
      min-width: 50px;
      text-align: right;
    }

    @font-face { font-family: 'DSEG7 Classic'; src: url('DSEG7Classic-Regular.woff') format('woff'); font-weight: normal; font-style: normal; }
    #ctrl { position:fixed; top:56px; left:12px; background:rgba(8,12,18,.6); padding:8px 10px; border-radius:10px; font:12px/1.35 monospace; backdrop-filter: blur(6px); border:1px solid rgba(255,255,255,.08); max-width:54ch; display: none; z-index:5; }
    #ctrl button { padding:4px 8px; border-radius:8px; }
    .hint { opacity:.8; font-size:12px; margin-left:12px; }
    #videoPopup, #nearMissPopup, #topsPopup, #triplePopup { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 100; display: grid; place-items: center; }
    #video180, #videoNearMiss, #videoTops, #videoTriple { width: 90vw; max-width: 800px; height: auto; object-fit: contain; border: 2px solid #fff; border-radius: 8px; }
    .popup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; z-index: 300; display: grid; place-items: center; text-align: center; backdrop-filter: blur(5px); }
    .popup-card { background: #1b2736; padding: 40px 60px; border-radius: 12px; border: 2px solid #3b82f6; box-shadow: 0 0 30px #3b82f6; }
    .popup-card h1 { font-size: 2.5em; margin: 0 0 20px 0; }
    .popup-card .button-row { display: flex; gap: 15px; justify-content: center; }
    #winPopup .popup-card { border-color: #f59e0b; box-shadow: 0 0 30px #f59e0b; }
    #winPopup h1 { font-size: 3em; color: #f59e0b; }
    #winPopup h2 { font-size: 1.5em; margin: 10px 0 30px 0; }
    #gameSetup { position: fixed; inset: 0; background: #0b0f14; z-index: 200; display: grid; place-items: center; text-align: center; font-size: 1.2em; }
    #gameSetup h1 { font-weight: 300; }
    #gameSetup .options { display: flex; gap: 10px; margin: 15px 0; flex-wrap:wrap; justify-content:center; }
    #gameSetup .options button { padding: 12px 16px; font-size: 1.1em; background: #1b2736; opacity: 0.7; }
    #gameSetup .options button.selected { background: #3b82f6; opacity: 1.0; box-shadow: 0 0 10px #3b82f6; }
    #gameSetup .input-group { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0; }
    #gameSetup .input-group label { opacity: 0.8; font-size: 0.9em; min-width: 80px; text-align: right; }
    #gameSetup .input-group input { background: #1b2736; border: 1px solid #2a3340; color: #e7f0ff; padding: 8px 10px; border-radius: 6px; font-size: 1em; }
    #btnStartGame { margin-top: 20px; padding: 14px 20px; font-size: 1.2em; background: #10b981; }
    
    .popup-card #turn-summary {
      background: #0d1016;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 25px;
      text-align: left;
      font-family: monospace;
      font-size: 1.2em;
      line-height: 1.6;
      border: 1px solid #2a3340;
    }
    .popup-card #turn-summary .summary-row {
      display: flex;
      justify-content: space-between;
    }
    .popup-card #turn-summary .summary-row span:first-child {
      opacity: 0.7;
    }
    .popup-card #turn-summary .summary-row span:last-child {
      font-weight: bold;
    }
    .popup-card #turn-summary .summary-total {
      font-weight: bold;
      color: #f59e0b; 
      font-size: 1.1em;
      margin-top: 10px;
    }
    .popup-card #turn-summary .summary-remaining {
      font-weight: bold;
      color: #fff;
      font-size: 1.1em;
    }
    .popup-card #turn-summary hr {
      border: none;
      border-top: 1px solid #2a3340;
      margin: 10px 0;
    }

  </style>
</head>
<body>
  
  <audio id="musicPlayer" loop></audio>

  <div id="gameSetup">
    <div>
      <h1>Darts Proto</h1>
      <h3>Kies Speltype</h3>
      <div class="options" id="gameTypeOptions">
        <button data-value="301">301</button>

        <button data-value="4">4 Spelers</button>
      </div>
      
      <h3>Namen (optioneel)</h3>
      <div id="playerNameInputs">
        </div>
      
      <button id="btnStartGame">Start Spel</button>
    </div>
  </div>
  
  <div id="wrap">
    <header> 
      <div class="row">
        <div>🎯 <strong>Darts Game</strong> <small id="ver"></small></div>

          <button id="btnFull">⛶ Volledig scherm</button>

          <button id="btnMute" aria-pressed="false">🔈 Geluid</button>
          <button id="btnBg">📷 Kies achtergrond</button>
          <button id="btnToggleBg">🖼️ Achtergrond Tonen</button>
          <button id="btnOverlay">🧭 Overlay Tonen</button>
          <button id="btnDebug">⚙️ Kalibratie Paneel Tonen</button>
        </div>
      </div>
    </header>
