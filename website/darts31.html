<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Darts Game v1.9c (Tops & Triple Videos)</title>
  <meta name="author" content="Christian Glebbeek, iCt Hrose">
  <meta name="copyright" content="Copyright Christian Glebbeek, iCt Hrose 2025. Alle rechten voorbehouden.">
  <style>
    /* ... (CSS is identiek aan v1.8c, behalve de nieuwe popup IDs) ... */
    html, body { margin:0; height:100%; background:#0b0f14; color:#e7f0ff; font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial; overflow:hidden; }
    #wrap { position:fixed; inset:0; display:grid; grid-template-rows:auto 1fr auto; display:none; }
    header, footer { padding:8px 12px; background:#0f1620; border-bottom:1px solid #1c2633; z-index:10; }
    footer { border-top:1px solid #1c2633; border-bottom:none; font-size:12px; opacity:.9; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    button { appearance:none; border:none; padding:8px 10px; border-radius:10px; background:#1b2736; color:#e7f0ff; box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 1px 8px rgba(0,0,0,.25); cursor:pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    button:active { transform:translateY(1px); }
    .popup-button-primary { background: #10b981; padding: 14px 20px; font-size: 1.2em; }
    .popup-button-secondary { background: #7f1d1d; padding: 14px 20px; font-size: 1.2em; color: #fecaca; }
    #btnEndGame { background: #7f1d1d; color: #fecaca; }
    #btnUndo { background: #9a3412; color: #fdba74; }
    #canvas { position:fixed; top:0; left:0; width:100vw; height:100vh; display:block; touch-action:none; background:#000; cursor: none; }
    #scoreboard { position:fixed; top:56px; right:12px; background:rgba(20,24,30,.7); padding:15px 20px; border-radius:12px; font-family:'DSEG7', monospace; backdrop-filter: blur(8px); border:1px solid rgba(255,255,255,0.1); box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.05); min-width:240px; z-index:5; transition: opacity 0.3s ease; }
    #scoreboard .player-section { background: #0d1016; padding: 10px 15px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #2a3340; box-shadow: inset 0 0 5px rgba(0,0,0,0.5); position: relative; }
    #scoreboard .player-name { color: #e7f0ff; font-size: 1.1em; margin-bottom: 5px; font-family: system-ui; }
    #scoreboard .nixie-score, #scoreboard .nixie-turn-score, #scoreboard .nixie-darts-remaining, #scoreboard .checkout-guide { font-family: 'DSEG7 Classic', monospace; font-size: 2.2em; color: #ff9900; text-shadow: 0 0 2px #ff9900, 0 0 10px #ff9900, 0 0 20px rgba(255,153,0,0.5); letter-spacing: 0.05em; background: #1a1e26; padding: 5px 8px; border-radius: 4px; display: inline-block; min-width: 60px; text-align: right; position: relative; overflow: hidden; }
    #scoreboard .nixie-score::before, #scoreboard .nixie-turn-score::before, #scoreboard .nixie-darts-remaining::before, #scoreboard .checkout-guide::before { content: attr(data-value); position: absolute; top: 0; left: 0; right: 0; bottom: 0; color: rgba(255,153,0,0.1); text-shadow: none; z-index: 1; opacity: 0.5; }
    #scoreboard .nixie-score span, #scoreboard .nixie-turn-score span, #scoreboard .nixie-darts-remaining span, #scoreboard .checkout-guide span { position: relative; z-index: 2; }
    #scoreboard .turn-details { margin-top: 8px; font-size: 0.9em; color: #aebacd; font-family: system-ui; }
    #scoreboard .turn-details .turn-score-label, #scoreboard .turn-details .darts-remaining-label { font-size: 0.8em; opacity: 0.7; }
    #scoreboard .message { margin-top: 15px; color: #ff0000; font-weight: bold; text-shadow: 0 0 5px #ff0000; font-family: system-ui; }
    #scoreboard .checkout-guide { font-size: 1.6em; min-width: 160px; text-align: center; margin-top: 5px; }
    #scoreboard .checkout-label { font-family: system-ui; font-size: 0.8em; opacity: 0.7; display: block; margin-top: 10px; text-align: center; }
    #scoreboard .manual-entry { display: flex; gap: 8px; margin-top: 10px; }
    #scoreboard .manual-entry input { width: 80px; background: #1a1e26; border: 1px solid #2a3340; color: #ff9900; font-family: 'DSEG7 Classic', monospace; font-size: 1.5em; text-align: right; padding: 5px; border-radius: 4px; }
    #scoreboard .manual-entry input::-webkit-outer-spin-button, #scoreboard .manual-entry input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    #scoreboard .manual-entry input[type=number] { -moz-appearance: textfield; }
    #scoreboard .manual-entry button { flex: 1; font-size: 1em; padding: 5px 10px; }
    @font-face { font-family: 'DSEG7 Classic'; src: url('DSEG7Classic-Regular.woff') format('woff'); font-weight: normal; font-style: normal; }
    #ctrl { position:fixed; top:56px; left:12px; background:rgba(8,12,18,.6); padding:8px 10px; border-radius:10px; font:12px/1.35 monospace; backdrop-filter: blur(6px); border:1px solid rgba(255,255,255,.08); max-width:54ch; display: none; z-index:5; }
    #ctrl button { padding:4px 8px; border-radius:8px; }
    .hint { opacity:.8; font-size:12px; margin-left:12px; }
    #videoPopup, #nearMissPopup, #topsPopup, #triplePopup { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 100; display: grid; place-items: center; }
    #video180, #videoNearMiss, #videoTops, #videoTriple { width: 90vw; max-width: 800px; height: auto; object-fit: contain; border: 2px solid #fff; border-radius: 8px; }
    .popup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; z-index: 300; display: grid; place-items: center; text-align: center; backdrop-filter: blur(5px); }
    .popup-card { background: #1b2736; padding: 40px 60px; border-radius: 12px; border: 2px solid #3b82f6; box-shadow: 0 0 30px #3b82f6; }
    .popup-card h1 { font-size: 2.5em; margin: 0 0 20px 0; }
    .popup-card .button-row { display: flex; gap: 15px; justify-content: center; }
    #winPopup .popup-card { border-color: #f59e0b; box-shadow: 0 0 30px #f59e0b; }
    #winPopup h1 { font-size: 3em; color: #f59e0b; }
    #winPopup h2 { font-size: 1.5em; margin: 10px 0 30px 0; }
    #gameSetup { position: fixed; inset: 0; background: #0b0f14; z-index: 200; display: grid; place-items: center; text-align: center; font-size: 1.2em; }
    #gameSetup h1 { font-weight: 300; }
    #gameSetup .options { display: flex; gap: 10px; margin: 15px 0; flex-wrap:wrap; justify-content:center; }
    #gameSetup .options button { padding: 12px 16px; font-size: 1.1em; background: #1b2736; opacity: 0.7; }
    #gameSetup .options button.selected { background: #3b82f6; opacity: 1.0; box-shadow: 0 0 10px #3b82f6; }
    #gameSetup .input-group { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0; }
    #gameSetup .input-group label { opacity: 0.8; font-size: 0.9em; min-width: 80px; text-align: right; }
    #gameSetup .input-group input { background: #1b2736; border: 1px solid #2a3340; color: #e7f0ff; padding: 8px 10px; border-radius: 6px; font-size: 1em; }
    #btnStartGame { margin-top: 20px; padding: 14px 20px; font-size: 1.2em; background: #10b981; }
  </style>
</head>
<body>
  
  <audio id="musicPlayer" loop></audio>

  <div id="gameSetup">
    <div>
      <h1>Darts Proto</h1>
      <h3>Kies Speltype</h3>
      <div class="options" id="gameTypeOptions">
        <button data-value="301">301</button>
        <button data-value="501" class="selected">501</button>
        <button data-value="Rotatie 301">Rotatie 301</button>
        <button data-value="Rotatie 501">Rotatie 501</button>
        <button data-value="Oefenen 301">Oefenen (301)</button>
        <button data-value="Oefenen 501">Oefenen (501)</button>
      </div>
      <h3>Kies Aantal Spelers</h3>
      <div class="options" id="playerCountOptions">
        <button data-value="1" class="selected">1 Speler</button>
        <button data-value="2">2 Spelers</button>
        <button data-value="3">3 Spelers</button>
        <button data-value="4">4 Spelers</button>
      </div>
      
      <h3>Namen (optioneel)</h3>
      <div id="playerNameInputs">
        </div>
      
      <button id="btnStartGame">Start Spel</button>
    </div>
  </div>
  
  <div id="wrap">
    <header>
      <div class="row">
        <div>🎯 <strong>Darts Game</strong> <small id="ver">v1.9c</small></div>
        <div class="row">
          <button id="btnFull">⛶ Volledig scherm</button>
          <button id="btnUndo" disabled>↩️ Ongedaan</button>
          <button id="btnEndGame">❌ Stop Spel</button>
          <button id="btnMute" aria-pressed="false">🔈 Geluid</button>
          <button id="btnBg">📷 Kies achtergrond</button>
          <button id="btnToggleBg">🖼️ Achtergrond Tonen</button>
          <button id="btnOverlay">🧭 Overlay</button>
          <button id="btnDebug">⚙️ Kalibratie Paneel Tonen</button>
        </div>
      </div>
    </header>
    <input id="bgFile" type="file" accept="image/*" style="position:absolute;left:-9999px;opacity:0;width:1px;height:1px;" />
    
    <canvas id="canvas" width="1280" height="720" aria-label="Dartboard canvas"></canvas>
    
    <div id="scoreboard"></div>
    
    <div id="ctrl">
        <div class="row" style="margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,.1);">
            <strong>Kalibratie Paneel</strong> 
            <button id="btnHideCtrl" style="margin-left: auto;">❌ Verbergen</button>
        </div>
        <div>Rotatie: <button id="rotLargeM">−5°</button> <button id="rotLargeP">+5°</button> <button id="rotM">−0.5°</button> <button id="rotP">+0.5°</button> <span id="rotVal"></span></div>
        <div>Center X: <button id="cxLargeM">−20 px</button> <button id="cxLargeP">+20 px</button> <button id="cxM">−2 px</button> <button id="cxP">+2 px</button> <span id="cxVal"></span></div>
        <div>Center Y: <button id="cyLargeM">−20 px</button> <button id="cyLargeP">+20 px</button> <button id="cyM">−2 px</button> <button id="cyP">+2 px</button> <span id="cyVal"></span></div>
        <div>Radius: <button id="rLargeM">−2%</button> <button id="rLargeP">+2%</button> <button id="rM">−0.2%</button> <button id="rP">+0.2%</button> <span id="rVal"></span></div>
        <div><button id="saveCal">💾 Bewaar</button> <small>(local)</small> <button id="resetCal">↺ Reset</button></div>
    </div>
    
    <div id="videoPopup" style="display:none;">
      <video id="video180" playsinline></video>
    </div>
    
    <div id="nearMissPopup" style="display:none;">
      <video id="videoNearMiss" playsinline></video>
    </div>
    
    <div id="topsPopup" style="display:none;">
      <video id="videoTops" playsinline></video>
    </div>
    <div id="triplePopup" style="display:none;">
      <video id="videoTriple" playsinline></video>
    </div>

    <div id="winPopup" class="popup-overlay" style="display:none;">
      <div class="popup-card">
        <h1>🏆 GEWONNEN! 🏆</h1>
        <h2 id="winnerName"></h2>
        <button id="btnNewGamePopup" class="popup-button-primary">Nieuw Spel</button>
      </div>
    </div>
    
    <div id="turnPopup" class="popup-overlay" style="display:none;">
      <div class="popup-card">
        <h1>Beurt Voorbij</h1>
        <div class="button-row">
            <button id="btnPopupEndGame" class="popup-button-secondary">❌ Stop Spel</button>
            <button id="btnPopupNextTurn" class="popup-button-primary">Volgende Beurt ➡️</button>
        </div>
      </div>
    </div>

    <main></main>
    
    <footer>
      <div class="hint">
        Besturing: Houd linkermuisknop ingedrukt om te mikken, laat los om te gooien.
      </div>
    </footer>
  </div>

<script>
/*
 * Copyright (c) 2025 Christian Glebbeek, iCt Hrose. Alle rechten voorbehouden.
 * https://icthorse.nl
 *
 * Dit script is onderdeel van het Darts Game (v1.9c) en mag niet
 * worden gekopieerd, gedistribueerd of gewijzigd zonder 
 * uitdrukkelijke schriftelijke toestemming van de eigenaar.
 */
(async () => {
  const VER = '1.9c';
  
  const MIN_HOLD_TIME_MS = 100; 
  const NEAR_MISS_TOLERANCE = 0.015;

  const cvs = document.getElementById('canvas');
  const ctx = cvs.getContext('2d');
  const videoPopup = document.getElementById('videoPopup');
  const video180 = document.getElementById('video180');
  const nearMissPopup = document.getElementById('nearMissPopup');
  const videoNearMiss = document.getElementById('videoNearMiss');
  // AANGEPAST: v1.9c - Nieuwe video elementen
  const topsPopup = document.getElementById('topsPopup');
  const videoTops = document.getElementById('videoTops');
  const triplePopup = document.getElementById('triplePopup');
  const videoTriple = document.getElementById('videoTriple');
  
  const musicPlayer = document.getElementById('musicPlayer');
  
  const gameSetupEl = document.getElementById('gameSetup');
  const wrapEl = document.getElementById('wrap');
  const scoreboardEl = document.getElementById('scoreboard');
  const btnEndGame = document.getElementById('btnEndGame');
  const btnUndo = document.getElementById('btnUndo');
  const playerNameInputsEl = document.getElementById('playerNameInputs');
  
  const winPopupEl = document.getElementById('winPopup');
  const winnerNameEl = document.getElementById('winnerName');
  const btnNewGamePopup = document.getElementById('btnNewGamePopup');
  
  const turnPopupEl = document.getElementById('turnPopup');
  const btnPopupNextTurn = document.getElementById('btnPopupNextTurn');
  const btnPopupEndGame = document.getElementById('btnPopupEndGame');

  const DPR = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
  
  function fit(){
    const w = cvs.clientWidth = innerWidth;
    const h = cvs.clientHeight = innerHeight;
    cvs.width  = Math.floor(w * DPR);
    cvs.height = Math.floor(h * DPR);
  }
  addEventListener('resize', fit, {passive:true}); fit();

  const ORDER = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
  const FLIGHT_COLORS = ['#ef4444', '#3b82f6', '#f59e0b', '#10b981']; 
  const STORAGE = 'darts-v05-cal';
  const defaultCal = { cx:518.0, cy:518.0, R_do:401.52, rot:0.0 }; 
  let cal = {...defaultCal};
  try{ const s = JSON.parse(localStorage.getItem(STORAGE)||'null'); if(s) cal = s; }catch{}

  const state = {
    gamePhase: 'setup', 
    startScore: 501,
    playerCount: 1,
    rotationMode: false, 
    scorekeeperMode: false, 
    players: [], 
    currentPlayerIndex: 0,
    turnDarts: [], 
    turnStartScore: 0, 
    allDarts: [], 
    flyingDarts:[], 
    overlay:true,
    showBg: false,
    bg:{img:null, ready:false, dx:0, dy:0, dw:1, dh:1, S:1},
    visualRotation: 0, 
    show180: 0,
    t: 0, 
    mouse: { x:0, y:0, clientX: 0, holding: false, clickStartTime: 0 },
    aim: { tx: 0, ty: 0 }, 
    turnOverAfterVideo: false,
    isScoreboardHidden: false,
    media: {
      videos180_files: [],
      nearMiss_files: [],
      sounds180_files: [],
      sounds180_buffers: [],
      entrance_files: [], 
      videosTops_files: [], // Nieuw
      videosTriple_files: [], // Nieuw
      // Decks
      videos180_deck: [],
      nearMiss_deck: [],
      sounds180_deck: [],
      entrance_deck: [],
      videosTops_deck: [], // Nieuw
      videosTriple_deck: [] // Nieuw
    },
    pendingRewards: 0
  };

  // --- Audio Logic ---
  const audio = { ctx:null, muted:false };
  function ensureAudio(){ if(audio.ctx) return; const C = window.AudioContext||window.webkitAudioContext; if(!C) return; audio.ctx = new C(); }
  function thunk(){ if(audio.muted) return; ensureAudio(); if(!audio.ctx) return; const t=audio.ctx.currentTime; const o=audio.ctx.createOscillator(); const g=audio.ctx.createGain(); o.type='triangle'; o.frequency.value=160; o.connect(g); g.connect(audio.ctx.destination); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.25, t+.005); g.gain.exponentialRampToValueAtTime(.0001, t+.12); o.start(t); o.stop(t+.18); }
  
  function hundoEighty(callback){
    if(audio.muted || !audio.ctx || state.media.sounds180_buffers.length === 0) {
      if (callback) callback();
      return; 
    }
    
    if (state.media.sounds180_deck.length === 0) {
        state.media.sounds180_deck = [...state.media.sounds180_buffers];
    }
    const deck = state.media.sounds180_deck;
    const index = Math.floor(Math.random() * deck.length);
    const buffer = deck.splice(index, 1)[0];
    
    const source = audio.ctx.createBufferSource();
    source.buffer = buffer;
    source.connect(audio.ctx.destination);
    source.onended = callback; 
    source.start(0);
  }
  
  async function findFiles(basename, extension, list) {
     let i = 1;
     let found = true;
     while(found) {
       try {
         const res = await fetch(`${basename}${i}.${extension}`, { method: 'HEAD' });
         if (res.ok) {
           list.push(`${basename}${i}.${extension}`);
           i++;
         } else {
           found = false; 
         }
       } catch (e) {
         found = false; 
       }
     }
  }

  async function loadAudioBuffers(files, bufferList) {
     ensureAudio(); 
     if (!audio.ctx) return;
     
     const promises = files.map(async (file) => {
        try {
          const response = await fetch(file);
          const arrayBuffer = await response.arrayBuffer();
          const buffer = await audio.ctx.decodeAudioData(arrayBuffer);
          bufferList.push(buffer);
        } catch(e) {
          console.warn(`Kon audio niet laden: ${file}`, e);
        }
     });
     await Promise.all(promises);
  }

  // --- Background Image Logic ---
  (function tryLoadBG(){
    const img = new Image();
    img.onload = ()=>{ state.bg.img=img; state.bg.ready=true; state.showBg = true; document.getElementById('btnToggleBg').textContent = '🖼️ Achtergrond Verbergen'; };
    img.onerror = ()=>{};
    img.src = 'dartboard.jpg';
  })();
  const btnBg = document.getElementById('btnBg');
  const bgFile = document.getElementById('bgFile');
  btnBg.onclick = ()=> bgFile.click();
  bgFile.onchange = (e)=>{ 
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const url = URL.createObjectURL(f); 
    const img = new Image();
    img.onload = ()=>{ state.bg.img=img; state.bg.ready=true; state.showBg = true; document.getElementById('btnToggleBg').textContent = '🖼️ Achtergrond Verbergen'; URL.revokeObjectURL(url); };
    img.onerror = ()=> URL.revokeObjectURL(url);
    img.src = url; 
  };

  // --- Scaling & Scoring Logic ---
  function computeContain(){
    const cw=cvs.width, ch=cvs.height;
    const img = state.bg.img; if(!img) return {dx:0,dy:0,dw:cw,dh:ch,S:1};
    const ir = img.width/img.height; const cr = cw/ch;
    let dw, dh, dx, dy;
    if (cr > ir) { dh = ch; dw = ch * ir; dx = (cw - dw) / 2; dy = 0; }
    else { dw = cw; dh = cw / ir; dx = 0; dy = (ch - dh) / 2; }
    const S = dw / img.width; 
    state.bg.dx=dx; state.bg.dy=dy; state.bg.dw=dw; state.bg.dh=dh; state.bg.S = S;
    return {dx,dy,dw,dh,S};
  }
  function toCanvasFromImage(px,py){ 
    const {dx,dy,S} = state.bg.S ? state.bg : computeContain(); 
    const x = (px * S) + dx; const y = (py * S) + dy;
    return [x,y,S]; 
  }
  function toCanvasRadiusFromImage(R){ 
    const {S} = state.bg.S ? state.bg : computeContain();
    return R * S; 
  }
  const RAT = { bull: 6.35/170, outerBull: 15.9/170, tripleIn: 99/170, tripleOut: 107/170, doubleIn: 162/170, doubleOut: 1.0 };
  
  function scoreAtCanvas(xc,yc){
    const [cx,cy,S] = toCanvasFromImage(cal.cx, cal.cy);
    const R = toCanvasRadiusFromImage(cal.R_do);
    const dx = xc - cx, dy = yc - cy;
    const r = Math.hypot(dx,dy);
    const dist = r / R;
    let ring='miss', mult=0, label='Miss', isNearMiss = false;
    
    if(dist <= RAT.bull){ ring='bull'; mult=50; label='BULL (50)'; }
    else if(dist <= RAT.outerBull){ ring='outer'; mult=25; label='Outer Bull (25)'; }
    else if(dist > RAT.doubleOut){ ring='miss'; mult=0, label='Miss'; }
    else if(dist >= RAT.doubleIn){ ring='double'; }
    else if(dist >= RAT.tripleIn && dist <= RAT.tripleOut){ ring='triple'; }
    else { 
      ring='single'; 
      if ( (dist > RAT.tripleIn - NEAR_MISS_TOLERANCE && dist < RAT.tripleIn) ||    
           (dist < RAT.tripleOut + NEAR_MISS_TOLERANCE && dist > RAT.tripleOut) || 
           (dist > RAT.doubleIn - NEAR_MISS_TOLERANCE && dist < RAT.doubleIn) ) {  
          isNearMiss = true;
      }
    }
    
    let base=0, sector=0;
    if(ring==='bull' || ring==='outer'){ /* base 0 */ }
    else if(ring !== 'miss') {
      let ang = (Math.atan2(yc - cy, xc - cx) * 180/Math.PI);
      ang = (ang + 90 + 360) % 360;
      const currentRotation = (cal.rot + state.visualRotation) % 360;
      ang = (ang - currentRotation + 360) % 360;
      const idx = Math.floor((ang + 9) / 18) % 20;
      base = ORDER[idx]; sector=base;
      if(ring==='double') { mult = base*2; label = `D${base} (${mult})`; }
      else if(ring==='triple') { mult = base*3; label = `T${base} (${mult})`; }
      else if(ring==='single') { mult = base; label = `${base}`; }
    }
    return {score:mult, ring, sector, base, label, cx, cy, R, dist, r, isNearMiss};
  }

  const BOGEY_SCORES = [169, 168, 166, 165, 163, 162, 159];
  const CHECKOUT_GUIDE = {

  function refreshScoreboard(message = "") {
    let html = '';
    
    state.players.forEach((p, index) => {
      const active = (index === state.currentPlayerIndex);
      const activeClass = active ? ' active' : '';
      const isCurrentPlayer = (index === state.currentPlayerIndex);
      
      const currentTurnScore = isCurrentPlayer ? state.turnDarts.reduce((acc, d) => acc + d.score, 0) : 0;
      const dartsRemaining = isCurrentPlayer ? Math.max(0, 3 - state.turnDarts.length) : 0;

      let style = `border-color: ${p.flightColor};`;
      if (active) {
          style += `box-shadow: 0 0 8px ${p.flightColor}, inset 0 0 8px ${p.flightColor};`;
      } else {
          style += `opacity: 0.7;`;
      }

      html += `<div class="player-section${activeClass}" style="${style}">`;
      html += `<div class="player-name">${p.name}</div>`;
      html += `<div class="nixie-score" data-value="${String(p.score).padStart(3, '0')}"><span>${String(p.score).padStart(3, '0')}</span></div>`;
      
      if (!state.scorekeeperMode) {
          const checkout = getCheckout(p.score);
          html += `<span class="checkout-label">Mogelijke Finish:</span>`;
          html += `<div class="nixie-score checkout-guide" data-value="${checkout}"><span>${checkout}</span></div>`;

  function throwDartAt(tx, ty) {
    if (state.gamePhase !== 'playing' || state.turnDarts.length >= 3) return;
    refreshScoreboard(); 
    const startX = cvs.width*0.5 + (Math.random()*80-40)*DPR;
    const startY = cvs.height + 150*DPR;
    const t0 = performance.now(); 
    const dur = 400; 
    const ang = Math.atan2(ty - startY, tx - startX);
    const arcRandom = 0.5 + Math.random(); 
    const baseArcHeight = 100 * DPR;
    const arcHeight = baseArcHeight * arcRandom;
    const d = {startX, startY, tx, ty, t0, dur, done:false, ang: ang, arcHeight: arcHeight};
    state.flyingDarts.push(d);
  }

  // --- Draw Functies ---
  function drawDart(x,y,angle, flightColor = '#006400'){
    ctx.save();
    ctx.translate(x,y); 
    ctx.rotate(angle);  
    const s = DPR * 1.2;
    ctx.translate(-40*s, 0); 
    ctx.fillStyle = '#222';
    ctx.beginPath(); 
    ctx.moveTo(25*s,0); ctx.lineTo(40*s,-2*s); ctx.lineTo(40*s,2*s); 
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#b8860b'; 
    ctx.lineWidth = 8*s; 
    ctx.lineCap='butt';
    ctx.beginPath(); ctx.moveTo(25*s,0); ctx.lineTo(-20*s,0); ctx.stroke();
    ctx.strokeStyle = '#FDEE00'; 
    ctx.lineWidth = 2*s;
    ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.moveTo(20*s, -2*s); ctx.lineTo(-15*s, -2*s); ctx.stroke();
    ctx.globalAlpha = 1.0;
    ctx.strokeStyle = '#111'; 
    ctx.lineWidth = 4*s; 
    ctx.lineCap='butt';
    ctx.beginPath(); ctx.moveTo(-20*s,0); ctx.lineTo(-70*s,0); ctx.stroke();
    ctx.fillStyle = flightColor; 
    const f = 18*s;
    ctx.beginPath(); 
    ctx.moveTo(-70*s,0); ctx.quadraticCurveTo(-86*s,-f,-70*s,-f*1.6); ctx.quadraticCurveTo(-52*s,-f*1.2,-52*s,0); 
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); 
    ctx.moveTo(-70*s,0); ctx.quadraticCurveTo(-86*s, f,-70*s, f*1.6); ctx.quadraticCurveTo(-52*s, f*1.2,-52*s,0); 
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.moveTo(-60*s, 0); ctx.lineTo(-72*s, f*0.9); ctx.lineTo(-72*s, -f*0.9);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1.0;
    ctx.restore();
  }

  function checkScoreboardVisibility() {
    if (state.gamePhase !== 'playing' || state.gamePhase === 'awaiting_rewards') {
        if (state.isScoreboardHidden) {
            scoreboardEl.style.opacity = '1';
            scoreboardEl.style.pointerEvents = 'auto';
            state.isScoreboardHidden = false;
        }
        return;
    }
    
    const boardRect = scoreboardEl.getBoundingClientRect();
    const boardLeft = boardRect.left;
    const mouseX = state.mouse.clientX;
    const proximity = 20; 

    if (mouseX > boardLeft - proximity) {
        if (!state.isScoreboardHidden) {
            scoreboardEl.style.opacity = '0.2';
            scoreboardEl.style.pointerEvents = 'none';
            state.isScoreboardHidden = true;
        }
    } else {
        if (state.isScoreboardHidden) {
            scoreboardEl.style.opacity = '1';
            scoreboardEl.style.pointerEvents = 'auto';
            state.isScoreboardHidden = false;
        }
    }
  }

  function drawAimCursor(t){
    checkScoreboardVisibility();
    
    if (state.scorekeeperMode && !state.mouse.holding) {
        // Doe niets
    } else if (state.gamePhase === 'playing' && state.turnDarts.length < 3) {
        const x = state.mouse.x;
        const y = state.mouse.y;
        state.aim.tx = x;
        state.aim.ty = y;
        const holding = state.mouse.holding;
        const color = holding ? '#FF0000' : '#00FF00';
        const s = DPR;
        ctx.save();
        ctx.translate(x, y); 
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 1 * s;
        ctx.globalAlpha = 0.8;
        ctx.beginPath();
        ctx.moveTo(-15 * s, 0); ctx.lineTo(-3 * s, 0); 
        ctx.moveTo( 15 * s, 0); ctx.lineTo( 3 * s, 0); 
        ctx.moveTo(0, -15 * s); ctx.lineTo(0, -3 * s); 
        ctx.moveTo(0,  15 * s); ctx.lineTo(0,  3 * s); 
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, 10 * s, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillRect(-0.5 * s, -0.5 * s, 1 * s, 1 * s); 
        ctx.restore();
    }
  }
  
  function drawOverlay(){
    if(!state.overlay) return;
    const [cx,cy] = toCanvasFromImage(cal.cx, cal.cy);
    const R = toCanvasRadiusFromImage(cal.R_do);
    const currentRotation = (cal.rot + state.visualRotation) % 360;
    const currentRotationRad = currentRotation * Math.PI / 180;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(currentRotationRad);
    ctx.translate(-cx, -cy);
    ctx.globalAlpha = 0.35; ctx.strokeStyle = '#00ffe0'; ctx.lineWidth = 2 * DPR;
    const rings = [RAT.bull,RAT.outerBull,RAT.tripleIn,RAT.tripleOut,RAT.doubleIn,RAT.doubleOut];
    rings.forEach(r=>{ ctx.beginPath(); ctx.arc(cx,cy,R*r,0,Math.PI*2); ctx.stroke(); });
    ctx.globalAlpha = 0.25;
    for(let j=0;j<20;j++){ 
        const a = (j*18 - 9 - 0) * Math.PI/180;
        const x = cx + Math.cos(a)*R;
        const y = cy + Math.sin(a)*R; 
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.stroke(); 
    }
    ctx.globalAlpha = 1.0; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `${18 * DPR}px sans-serif`; 
    const R_num = R * 1.08; 
    for(let i=0; i<20; i++){
        const baseAngle = 90 - (i * 18);
        const rotatedAngle = baseAngle - 0;
        const angleRad = rotatedAngle * Math.PI/180;
        const x = cx + Math.cos(angleRad) * R_num;
        const y = cy - Math.sin(angleRad) * R_num;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(-currentRotationRad);
        ctx.fillText(ORDER[i], 0, 0);
        ctx.restore();
    }
    ctx.restore(); 
  }
  
  function drawBackground(){
    const cw=cvs.width, ch=cvs.height;
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,cw,ch);
    if(state.showBg && state.bg.ready && state.bg.img){
      const img = state.bg.img;
      const {dx,dy,dw,dh} = computeContain(); 
      ctx.save();
      const centerX = dx + dw / 2;
      const centerY = dy + dh / 2;
      ctx.translate(centerX, centerY);
      ctx.rotate(state.visualRotation * Math.PI / 180);
      ctx.translate(-centerX, -centerY);
      ctx.drawImage(img, 0, 0, img.width, img.height, dx, dy, dw, dh);
      ctx.restore(); 
      return;
    }
    ctx.fillStyle = '#222'; ctx.fillRect(0,0,cw,ch);
  }

    if
