<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Darts Proto v0.13 (POV Physics Throw)</title>
  <style>
    html, body { margin:0; height:100%; background:#0b0f14; color:#e7f0ff; font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial; overflow:hidden; }
    #wrap { position:fixed; inset:0; display:grid; grid-template-rows:auto 1fr auto; }
    header, footer { padding:8px 12px; background:#0f1620; border-bottom:1px solid #1c2633; z-index:10; }
    footer { border-top:1px solid #1c2633; border-bottom:none; font-size:12px; opacity:.9; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    
    button { 
      appearance:none; border:none; padding:8px 10px; border-radius:10px; 
      background:#1b2736; color:#e7f0ff; 
      box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 1px 8px rgba(0,0,0,.25); 
      cursor:pointer; 
      user-select: none; -webkit-user-select: none; touch-action: manipulation;
    }
    button:disabled { opacity:.5; cursor:not-allowed; }
    button:active { transform:translateY(1px); }
    
    /* AANGEPAST: Canvas vult nu 100% en staat achter de UI */
    #canvas { position:fixed; top:0; left:0; width:100vw; height:100vh; display:block; touch-action:none; background:#000; }
    
    #hud { position:fixed; top:56px; right:12px; background:rgba(8,12,18,.6); padding:8px 10px; border-radius:10px; font:12px/1.35 monospace; backdrop-filter: blur(6px); border:1px solid rgba(255,255,255,.08); max-width:50ch; z-index:5; }
    #ctrl { 
      position:fixed; top:56px; left:12px; 
      background:rgba(8,12,18,.6); padding:8px 10px; border-radius:10px; 
      font:12px/1.35 monospace; backdrop-filter: blur(6px); border:1px solid rgba(255,255,255,.08); 
      max-width:54ch; display: none; z-index:5;
    }
    #ctrl button { padding:4px 8px; border-radius:8px; }

    /* NIEUW: v0.13 - Stijlen voor de gooi-besturing uit test-anim.html */
    .ui {
      /* Positionering binnen de footer */
      width:100%;
      display:flex; gap:12px; align-items:center; justify-content:space-between;
      user-select:none; pointer-events:none;
    }
    .card {
      backdrop-filter: blur(6px); background:rgba(0,0,0,.5); border:1px solid #ffffff22;
      border-radius:12px; padding:10px 12px; pointer-events:auto;
    }
    .meters {display:flex; gap:10px; align-items:center}
    .bar {width:120px; height:8px; background:#111827; border-radius:999px; overflow:hidden; border:1px solid #ffffff20}
    .fill {height:100%; width:0%}
    .hint {opacity:.8; font-size:12px}
  </style>
</head>
<body>
  <div id="wrap">
    <header>
      <div class="row">
        <div>🎯 <strong>Darts Proto</strong> <small id="ver">v0.13</small></div>
        <div class="row">
          <button id="btnFull">⛶ Volledig scherm</button>
          <button id="btnNew">➕ Nieuwe beurt</button>
          <button id="btnMute" aria-pressed="false">🔈 Geluid</button>
          <button id="btnTest180">📣 Test 180</button>
          <button id="btnPlayEmbed">▶️ Speel Audio</button>
          <button id="btnBg">📷 Kies achtergrond</button>
          <button id="btnToggleBg">🖼️ Achtergrond Tonen</button>
          <button id="btnOverlay">🧭 Overlay</button>
          <button id="btnDebug">⚙️ Kalibratie Paneel Tonen</button>
        </div>
      </div>
    </header>
    <input id="bgFile" type="file" accept="image/*" style="position:absolute;left:-9999px;opacity:0;width:1px;height:1px;" />
    
    <canvas id="canvas" width="1280" height="720" aria-label="Dartboard canvas"></canvas>
    
    <div id="hud"></div>
    <div id="ctrl">
      <div class="row" style="margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,.1);">
            <strong>Kalibratie Paneel</strong> 
            <button id="btnHideCtrl" style="margin-left: auto;">❌ Verbergen</button>
        </div>
        <div>Rotatie: <button id="rotLargeM">−5°</button> <button id="rotLargeP">+5°</button> <button id="rotM">−0.5°</button> <button id="rotP">+0.5°</button> <span id="rotVal"></span></div>
        <div>Center X: <button id="cxLargeM">−20 px</button> <button id="cxLargeP">+20 px</button> <button id="cxM">−2 px</button> <button id="cxP">+2 px</button> <span id="cxVal"></span></div>
        <div>Center Y: <button id="cyLargeM">−20 px</button> <button id="cyLargeP">+20 px</button> <button id="cyM">−2 px</button> <button id="cyP">+2 px</button> <span id="cyVal"></span></div>
        <div>Radius: <button id="rLargeM">−2%</button> <button id="rLargeP">+2%</button> <button id="rM">−0.2%</button> <button id="rP">+0.2%</button> <span id="rVal"></span></div>
        <div><button id="saveCal">💾 Bewaar</button> <small>(local)</small> <button id="resetCal">↺ Reset</button></div>
    </div>
    
    <main></main>
    
    <footer>
      <div class="ui">
        <div class="card hint">
          <strong>Besturing:</strong> Houd vast & sleep (kracht & spin), laat los om te gooien.
        </div>
        <div class="card meters">
          <div>Kracht</div>
          <div class="bar"><div id="powerFill" class="fill"></div></div>
          <div>Spin</div>
          <div class="bar"><div id="spinFill" class="fill"></div></div>
        </div>
      </div>
    </footer>
  </div>

<script>
(() => {
  // AANGEPAST: Versie en features
  // v0.13: POV physics-based throw (uit test-anim.html) gemerged met v0.12 scoring/calibration.
  const VER = '0.13';
  document.getElementById('ver').textContent = 'v'+VER;

  const cvs = document.getElementById('canvas');
  const ctx = cvs.getContext('2d');
  const DPR = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
  
  // AANGEPAST: v0.13 - Resize-functie uit test-anim.html (is beter)
  function fit(){
    const w = cvs.clientWidth = innerWidth;
    const h = cvs.clientHeight = innerHeight;
    cvs.width  = Math.floor(w * DPR);
    cvs.height = Math.floor(h * DPR);
    // ctx.setTransform(DPR,0,0,DPR,0,0); // We managen DPR handmatig in de draw functies
  }
  addEventListener('resize', fit, {passive:true}); fit();

  // --- v0.12 Game Logic Data ---
  const ORDER = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
  const STORAGE = 'darts-v05-cal';
  const defaultCal = { cx:526.0, cy:500.0, R_do:408.0, rot:0.0 }; 
  let cal = {...defaultCal};
  try{ const s = JSON.parse(localStorage.getItem(STORAGE)||'null'); if(s) cal = s; }catch{}

  // AANGEPAST: v0.13 - State object is een merge
  const state = {
    // v0.12 state
    darts:[],     // Array van *gegooide* pijlen
    turn:1, thrown:0, total:0,
    overlay:true,
    showBg: false,
    bg:{img:null, ready:false, dx:0, dy:0, dw:1, dh:1, S:1},
    show180: 0,
    
    // v0.13 (test-anim) state
    holding: true,  // Hand klaar met pijl
    t: 0,           // animatie tijd
    trail: [],
    currentDart: {  // De pijl die *nu* vliegt
      x: 0, y: 0, vx: 0, vy: 0, spin: 0, angle: 0,
    },
    aim: {power: 0, angle: -0.2, spin: 0.1},
    physics: { gravity: 2000 * DPR, air: 0.992 }, // Zwaartekracht geschaald met DPR
  };

  // --- v0.12 Audio Logic ---
  const audio = { ctx:null, muted:false, buffer180: null };
  function ensureAudio(){ if(audio.ctx) return; const C = window.AudioContext||window.webkitAudioContext; if(!C) return; audio.ctx = new C(); }
  function thunk(){ if(audio.muted) return; ensureAudio(); if(!audio.ctx) return; const t=audio.ctx.currentTime; const o=audio.ctx.createOscillator(); const g=audio.ctx.createGain(); o.type='triangle'; o.frequency.value=160; o.connect(g); g.connect(audio.ctx.destination); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.25, t+.005); g.gain.exponentialRampToValueAtTime(.0001, t+.12); o.start(t); o.stop(t+.18); }
  // AANGEPAST: whoosh() is niet meer nodig, we gebruiken de physics-based animatie
  function hundoEighty(){
    if(audio.muted || !audio.buffer180) return; 
    ensureAudio(); if(!audio.ctx) return; 
    const source = audio.ctx.createBufferSource();
    source.buffer = audio.buffer180;
    source.connect(audio.ctx.destination);
    source.start(0);
  }
  (async function load180Audio() {
      try {
          ensureAudio(); if (!audio.ctx) return;
          const response = await fetch('Best Dart 180 Voice.mp3'); 
          if (!response.ok) throw new Error(`Kon audiobestand niet laden: ${response.statusText}`);
          const arrayBuffer = await response.arrayBuffer();
          audio.buffer180 = await audio.ctx.decodeAudioData(arrayBuffer);
      } catch (e) { console.error('Fout bij het laden van de 180 audio:', e); }
  })();

  // --- v0.12 Background Image Logic ---
  (function tryLoadBG(){
    const img = new Image();
    img.onload = ()=>{ state.bg.img=img; state.bg.ready=true; state.showBg = true; document.getElementById('btnToggleBg').textContent = '🖼️ Achtergrond Verbergen'; };
    img.onerror = ()=>{};
    img.src = 'dartboard.jpg';
  })();
  const btnBg = document.getElementById('btnBg');
  const bgFile = document.getElementById('bgFile');
  btnBg.onclick = ()=> bgFile.click();
  bgFile.onchange = (e)=>{ 
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const url = URL.createObjectURL(f); 
    const img = new Image();
    img.onload = ()=>{ state.bg.img=img; state.bg.ready=true; state.showBg = true; document.getElementById('btnToggleBg').textContent = '🖼️ Achtergrond Verbergen'; URL.revokeObjectURL(url); };
    img.onerror = ()=> URL.revokeObjectURL(url);
    img.src = url; 
  };

  // --- v0.12 Scaling & Scoring Logic ---
  function computeContain(){
    const cw=cvs.width, ch=cvs.height;
    const img = state.bg.img; if(!img) return {dx:0,dy:0,dw:cw,dh:ch,S:1};
    const ir = img.width/img.height; const cr = cw/ch;
    let dw, dh, dx, dy;
    if (cr > ir) { dh = ch; dw = ch * ir; dx = (cw - dw) / 2; dy = 0; }
    else { dw = cw; dh = cw / ir; dx = 0; dy = (ch - dh) / 2; }
    const S = dw / img.width; 
    state.bg.dx=dx; state.bg.dy=dy; state.bg.dw=dw; state.bg.dh=dh; state.bg.S = S;
    return {dx,dy,dw,dh,S};
  }
  function toCanvasFromImage(px,py){ 
    const {dx,dy,S} = state.bg.S ? state.bg : computeContain(); 
    const x = (px * S) + dx; const y = (py * S) + dy;
    return [x,y,S]; 
  }
  function toCanvasRadiusFromImage(R){ 
    const {S} = state.bg.S ? state.bg : computeContain();
    return R * S; 
  }
  const RAT = { bull: 6.35/170, outerBull: 15.9/170, tripleIn: 99/170, tripleOut: 107/170, doubleIn: 162/170, doubleOut: 1.0 };
  function scoreAtCanvas(xc,yc){
    const [cx,cy,S] = toCanvasFromImage(cal.cx, cal.cy);
    const R = toCanvasRadiusFromImage(cal.R_do);
    const dx = xc - cx, dy = yc - cy;
    const r = Math.hypot(dx,dy);
    const dist = r / R;
    let ring='miss', mult=0, label='Miss';
    if(dist <= RAT.bull){ ring='bull'; mult=50; label='BULL (50)'; }
    else if(dist <= RAT.outerBull){ ring='outer'; mult=25; label='Outer Bull (25)'; }
    else if(dist > RAT.doubleOut){ ring='miss'; mult=0; label='Miss'; }
    else if(dist >= RAT.doubleIn){ ring='double'; }
    else if(dist >= RAT.tripleIn && dist <= RAT.tripleOut){ ring='triple'; }
    else { ring='single'; }
    let base=0, sector=0;
    if(ring==='bull' || ring==='outer'){ /* base 0 */ }
    else {
      let ang = (Math.atan2(yc - cy, xc - cx) * 180/Math.PI);
      ang = (ang + 90 + 360) % 360;
      ang = (ang - cal.rot + 360) % 360;
      const idx = Math.floor((ang + 9) / 18) % 20;
      base = ORDER[idx]; sector=base;
      if(ring==='double') { mult = base*2; label = `D${base} (${mult})`; }
      else if(ring==='triple') { mult = base*3; label = `T${base} (${mult})`; }
      else if(ring==='single') { mult = base; label = `${base}`; }
    }
    return {score:mult, ring, sector, base, label, cx, cy, R, dist, r};
  }

  // --- v0.12 HUD Logic ---
  const hud = document.getElementById('hud');
  function refreshHUD(){
    const lines = [];
    let subtotal = 0;
    state.darts.forEach((d,i)=>{ if(d.result){ subtotal+=d.result.score; lines.push(`Pijl ${i+1}: ${d.result.label}`); } else lines.push(`Pijl ${i+1}: ...`); });
    lines.push('—');
    lines.push(`Beurt ${state.turn} | Totaal: ${subtotal} | Nog: ${Math.max(0,3-state.thrown)}`);
    if(state.thrown>=3) lines.push('(Nieuwe beurt om door te gaan)');
    hud.innerHTML = lines.join('<br>');
    return subtotal; 
  }

  // --- NIEUW: v0.13 - UI Meters & Input Handling ---
  const powerFill = document.getElementById('powerFill');
  const spinFill  = document.getElementById('spinFill');
  function setMeter(el, value, colorA="#60a5fa", colorB="#22d3ee") {
    const v = Math.max(0, Math.min(1, value));
    el.style.width = (v*100).toFixed(1) + '%';
    el.style.background = `linear-gradient(90deg, ${colorA}, ${colorB})`;
  }
  
  let drag = null;
  function startDrag(x,y){
    if (state.thrown >= 3) return; // Geen nieuwe worp als beurt vol is
    drag = {sx:x, sy:y, x, y};
  }
  function moveDrag(x,y){
    if(!drag) return;
    drag.x = x; drag.y = y;
    const rect = cvs.getBoundingClientRect();
    const cx = rect.width * 0.5, cy = rect.height * 0.78;
    const dx = drag.x - drag.sx, dy = (drag.y - drag.sy);
    
    state.aim.power = Math.max(0, Math.min(1, (drag.sy - drag.y) / (rect.height * 0.5)));
    state.aim.spin  = Math.max(-1, Math.min(1, dx / (rect.width * 0.35)));
    
    // AANGEPAST: Doel coördinaten (calibratie)
    // We mikken op het gekalibreerde centrum
    const [calCX, calCY] = toCanvasFromImage(cal.cx, cal.cy);
    // Converteer canvas-DPR coords naar client coords
    const targetX = calCX / DPR;
    const targetY = calCY / DPR;

    const toCenter = Math.atan2(targetY - cy, targetX - cx);
    state.aim.angle = toCenter - 0.25 + state.aim.power*0.35 + state.aim.spin*0.08;
    
    setMeter(powerFill, state.aim.power);
    setMeter(spinFill, (state.aim.spin+1)/2, "#34d399", "#f59e0b");
  }
  function endDrag(){
    if(!drag) return;
    drag = null;
    throwDart();
  }

  // AANGEPAST: Input listeners op canvas, niet window
  cvs.addEventListener('mousedown', e=>startDrag(e.clientX, e.clientY));
  cvs.addEventListener('mousemove', e=>moveDrag(e.clientX, e.clientY));
  addEventListener('mouseup', endDrag); // 'mouseup' globaal houden
  cvs.addEventListener('touchstart', e=>{ e.preventDefault(); const t=e.changedTouches[0]; startDrag(t.clientX, t.clientY); }, {passive:false});
  cvs.addEventListener('touchmove', e=>{ e.preventDefault(); const t=e.changedTouches[0]; moveDrag(t.clientX, t.clientY); }, {passive:false});
  cvs.addEventListener('touchend', e=>{ e.preventDefault(); endDrag(); }, {passive:false});


  // --- NIEUW: v0.13 - Physics-based throwDart ---
  function throwDart(){
    if (state.thrown >= 3) return; // Dubbele check
    
    const w = cvs.clientWidth, h = cvs.clientHeight;
    // Oorsprong geschaald met DPR
    const origin = { x: (w*0.45 + (Math.random()-0.5)*12) * DPR, y: (h*0.78 + (Math.random()-0.5)*12) * DPR };
    
    const v = (2100 * (0.35 + 0.65*state.aim.power)) * DPR; // px/s
    state.currentDart.x = origin.x;
    state.currentDart.y = origin.y;
    state.currentDart.vx = Math.cos(state.aim.angle) * v * (1 + 0.02*(Math.random()-0.5));
    state.currentDart.vy = Math.sin(state.aim.angle) * v * (1 + 0.02*(Math.random()-0.5)) - (300*state.aim.power)*DPR;
    state.currentDart.spin = 8*state.aim.spin; // rad/s
    state.currentDart.angle = Math.atan2(state.currentDart.vy, state.currentDart.vx);
    
    state.holding = false;
    state.trail.length = 0;
  }
  
  // --- AANGEPAST: v0.13 - Gebruik de gestileerde drawDart uit test-anim ---
  function drawDart(x,y,angle){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(angle);
    const s = DPR * 1.2; // Schaalfactor voor de pijl

    // shaft
    ctx.lineWidth = 6*s; ctx.lineCap='round';
    ctx.strokeStyle = '#0e7490';
    ctx.beginPath(); ctx.moveTo(-70*s,0); ctx.lineTo(25*s,0); ctx.stroke();

    // tip
    ctx.fillStyle = '#94a3b8';
    ctx.beginPath(); ctx.moveTo(25*s,0); ctx.lineTo(40*s,-3*s); ctx.lineTo(40*s,3*s); ctx.closePath(); ctx.fill();

    // flights
    ctx.fillStyle = '#ef4444';
    const f = 18*s;
    ctx.beginPath(); // upper
    ctx.moveTo(-70*s,0); ctx.quadraticCurveTo(-86*s,-f,-70*s,-f*1.6); ctx.quadraticCurveTo(-52*s,-f*1.2,-52*s,0); ctx.closePath(); ctx.fill();
    ctx.beginPath(); // lower
    ctx.moveTo(-70*s,0); ctx.quadraticCurveTo(-86*s, f,-70*s, f*1.6); ctx.quadraticCurveTo(-52*s, f*1.2,-52*s,0); ctx.closePath(); ctx.fill();

    ctx.restore();
  }

  // --- NIEUW: v0.13 - Teken de hand (uit test-anim) ---
  function drawHand(t, holding){
    const w = cvs.width, h = cvs.height;
    const baseX = w*0.45, baseY = h*0.84;
    const pull = holding ? Math.sin(t*2.2)*6*DPR + state.aim.power*22*DPR : 0;
    const jitter = holding ? (Math.random()-0.5)*0.6*DPR : 0;

    const x = baseX - pull + jitter;
    const y = baseY + Math.cos(t*1.6)*2*DPR;

    ctx.save();
    ctx.translate(x,y);
    ctx.fillStyle = '#f8cfae';
    ctx.strokeStyle = '#00000020';
    ctx.lineWidth = 2 * DPR;

    const s = DPR * 1.5; // Schaalfactor voor de hand

    // palm
    ctx.beginPath();
    ctx.moveTo(-30*s,-10*s); ctx.quadraticCurveTo(30*s,-26*s, 42*s,0); ctx.quadraticCurveTo(38*s,28*s, -26*s,26*s); ctx.quadraticCurveTo(-36*s,10*s,-30*s,-10*s);
    ctx.fill(); ctx.stroke();

    // fingers
    const finger = (ox,oy,len,rot) => {
      ctx.save(); ctx.translate(ox,oy); ctx.rotate(rot);
      ctx.beginPath();
      ctx.moveTo(0,0); ctx.quadraticCurveTo(len*0.4,-10*s, len,0); ctx.quadraticCurveTo(len*0.4,12*s, 0,8*s); ctx.closePath();
      ctx.fill(); ctx.restore();
    };
    finger(26*s,-2*s, 28*s, -0.18); // index
    finger(20*s, 4*s, 26*s, -0.08);
    finger(12*s, 7*s, 24*s,  0.02);
    // thumb
    ctx.save(); ctx.translate(-10*s,6*s); ctx.rotate(0.9);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(20*s,-8*s,26*s,2*s); ctx.quadraticCurveTo(18*s,14*s,0,10*s); ctx.closePath(); ctx.fill();
    ctx.restore();

    if (holding) {
      ctx.save();
      ctx.translate(18*s,-2*s);
      const gripAngle = -0.05 + state.aim.power*0.08 + state.aim.spin*0.04;
      ctx.rotate(gripAngle);
      drawDart(-10*s,-6*s,0); // Pijl in de hand
      ctx.restore();
    }
    ctx.restore();
  }
  
  // --- v0.12 Drawing Functions ---
  function drawOverlay(){
    if(!state.overlay) return;
    const [cx,cy] = toCanvasFromImage(cal.cx, cal.cy);
    const R = toCanvasRadiusFromImage(cal.R_do);
    ctx.save();
    ctx.globalAlpha = 0.35; ctx.strokeStyle = '#00ffe0'; ctx.lineWidth = 2 * DPR;
    const rings = [RAT.bull,RAT.outerBull,RAT.tripleIn,RAT.tripleOut,RAT.doubleIn,RAT.doubleOut];
    rings.forEach(r=>{ ctx.beginPath(); ctx.arc(cx,cy,R*r,0,Math.PI*2); ctx.stroke(); });
    ctx.globalAlpha = 0.25;
    for(let j=0;j<20;j++){ const a = (j*18 - 9 - cal.rot) * Math.PI/180; const x = cx + Math.cos(a)*R; const y = cy + Math.sin(a)*R; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.stroke(); }
    ctx.globalAlpha = 1.0; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `${18 * DPR}px sans-serif`; 
    const R_num = R * 1.08; 
    for(let i=0; i<20; i++){ const baseAngle = 90 - (i * 18); const rotatedAngle = baseAngle - cal.rot; const angleRad = rotatedAngle * Math.PI/180; const x = cx + Math.cos(angleRad) * R_num; const y = cy - Math.sin(angleRad) * R_num; ctx.fillText(ORDER[i], x, y); }
    ctx.restore();
  }
  function drawBackground(){
    const cw=cvs.width, ch=cvs.height;
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,cw,ch);
    if(state.showBg && state.bg.ready && state.bg.img){
      const img = state.bg.img;
      const {dx,dy,dw,dh} = computeContain(); 
      ctx.drawImage(img, 0, 0, img.width, img.height, dx, dy, dw, dh);
      return;
    }
    ctx.fillStyle = '#222'; ctx.fillRect(0,0,cw,ch);
  }
  function draw180Banner(t){
    if (!state.show180) return;
    const elapsed = t - state.show180;
    if (elapsed > 3000) { state.show180 = 0; return; }
    let alpha = 1.0;
    if (elapsed < 300) alpha = elapsed / 300;
    else if (elapsed > 2500) alpha = (3000 - elapsed) / 500;
    const cw = cvs.width, ch = cvs.height;
    ctx.save();
    ctx.globalAlpha = alpha * 0.85; ctx.fillStyle = '#111'; ctx.fillRect(0, ch * 0.35, cw, ch * 0.3);
    ctx.globalAlpha = alpha; ctx.fillStyle = '#FFF'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const fontSize = Math.min(cw, ch) * 0.2; 
    ctx.font = `bold ${fontSize}px sans-serif`;
    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 20 * DPR;
    ctx.fillText('180!!', cw / 2, ch / 2);
    ctx.restore();
  }
  
  // --- NIEUW: v0.13 - Teken de pijlen die in het bord zitten ---
  function drawStuckDarts() {
    for (const d of state.darts) {
      drawDart(d.sx, d.sy, d.ang);
    }
  }

  // --- AANGEPAST: v0.13 - Hoofd Game Loop (gebaseerd op test-anim) ---
  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.033, (now-last)/1000); 
    last = now;
    state.t += dt;

    // 1. Teken achtergrond en bord (v0.12)
    drawBackground();
    drawOverlay();

    // 2. Teken pijlen in het bord (v0.13)
    drawStuckDarts();
    
    // 3. Update en teken vliegende pijl (v0.13 physics)
    if (!state.holding) {
      const d = state.currentDart;
      d.vy += state.physics.gravity * dt;
      d.vx *= state.physics.air; d.vy *= state.physics.air;
      d.x  += d.vx * dt;
      d.y  += d.vy * dt;
      d.angle = Math.atan2(d.vy, d.vx) + d.spin*0.03;

      // Motion blur trail
      state.trail.push({x:d.x, y:d.y, a:d.angle});
      while (state.trail.length>20) state.trail.shift();
      for (let i=state.trail.length-1;i>=0;i--){
        const p = state.trail[i];
        ctx.globalAlpha = (i/state.trail.length)*0.5;
        drawDart(p.x, p.y, p.a);
      }
      ctx.globalAlpha = 1;
      
      // Teken de "echte" pijl
      drawDart(d.x, d.y, d.angle);

      // AANGEPAST: Hit detectie met v0.12 scoring
      // We gebruiken het gekalibreerde centrum om het 'vlak' van het bord te bepalen
      const [calCX, calCY] = toCanvasFromImage(cal.cx, cal.cy);
      
      // Simpele check: als de pijl 'voorbij' het centrum is (op Y-as)
      if (d.vy > 0 && d.y >= calCY - 10*DPR) { // 10px tolerantie
        state.holding = true; // Stop physics
        state.trail.length = 0;
        state.aim.power *= 0.6; // Kracht neemt af
        
        // --- Score Logica ---
        thunk(); // Geluid
        d.result = scoreAtCanvas(d.x, d.y);
        state.darts.push({ sx: d.x, sy: d.y, ang: d.angle, result: d.result });
        state.thrown++;
        
        const subtotal = refreshHUD();
        if (state.thrown === 3 && subtotal === 180) {
            hundoEighty();
            state.show180 = performance.now(); 
        }
      }
    }
    
    // 4. Teken de hand (v0.13)
    drawHand(state.t, state.holding && state.thrown < 3); // Hand niet tonen als beurt vol is
    
    // 5. Teken 180 banner (v0.12)
    draw180Banner(now);

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);


  // --- v0.12 Knoppen & UI Logica ---
  const ctrl = document.getElementById('ctrl');
  const btnDebug = document.getElementById('btnDebug');
  const btnHideCtrl = document.getElementById('btnHideCtrl'); 
  function toggleCtrlPanel(explicitHide = false) {
    const isVisible = ctrl.style.display !== 'none';
    if (explicitHide || isVisible) { ctrl.style.display = 'none'; btnDebug.textContent = '⚙️ Kalibratie Paneel Tonen'; }
    else { ctrl.style.display = 'block'; btnDebug.textContent = '⚙️ Kalibratie Paneel Verbergen'; }
  }
  btnDebug.onclick = () => toggleCtrlPanel();
  btnHideCtrl.onclick = () => toggleCtrlPanel(true);

  const btnToggleBg = document.getElementById('btnToggleBg');
  btnToggleBg.onclick = ()=>{ if (state.bg.ready) { state.showBg = !state.showBg; btnToggleBg.textContent = state.showBg ? '🖼️ Achtergrond Verbergen' : '🖼️ Achtergrond Tonen'; } };

  // AANGEPAST: v0.13 - 'Nieuwe beurt' reset nu ook de physics-state
  document.getElementById('btnNew').onclick = ()=>{ 
    state.turn++; 
    state.darts.length=0; 
    state.thrown=0; 
    state.show180 = 0; 
    refreshHUD(); 
    
    // Reset physics state
    state.holding = true;
    state.trail.length = 0;
    state.currentDart = {x:0,y:0,vx:0,vy:0,spin:0,angle:0};
    setMeter(powerFill, 0);
    setMeter(spinFill, .5, "#34d399", "#f59e0b");
  };
  
  document.getElementById('btnFull').onclick = ()=>{ const el=document.documentElement; if(!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen).call(el); } else { document.exitFullscreen && document.exitFullscreen(); }};
  document.getElementById('btnMute').onclick = (e)=>{ audio.muted = !audio.muted; e.currentTarget.setAttribute('aria-pressed', String(audio.muted)); e.currentTarget.textContent = audio.muted? '🔇 Gedempt':'🔈 Geluid'; };
  document.getElementById('btnTest180').onclick = hundoEighty;
  document.getElementById('btnPlayEmbed').onclick = hundoEighty;
  document.getElementById('btnOverlay').onclick = ()=>{ state.overlay = !state.overlay; };

  // --- v0.12 Kalibratie Knoppen ---
  const rotVal = document.getElementById('rotVal'), cxVal = document.getElementById('cxVal'), cyVal = document.getElementById('cyVal'), rVal = document.getElementById('rVal');
  const saveCal = document.getElementById('saveCal'), resetCal = document.getElementById('resetCal');
  function updateLabels(){
    cal.rot = (cal.rot % 360 + 360) % 360; 
    rotVal.textContent = `= ${cal.rot.toFixed(2)}°`;
    cxVal.textContent = `= ${cal.cx.toFixed(1)} px`;
    cyVal.textContent = `= ${cal.cy.toFixed(1)} px`;
    rVal.textContent  = `= ${cal.R_do.toFixed(2)} px`;
  }
  updateLabels();
  let intervalId = null; const HOLD_DELAY = 80; 
  function clearHold() { if (intervalId !== null) { clearInterval(intervalId); intervalId = null; } }
  function setupHoldableButton(button, action) {
    button.addEventListener('pointerdown', (e) => { e.preventDefault(); action(); intervalId = setInterval(() => { action(); }, HOLD_DELAY); });
    button.addEventListener('contextmenu', (e) => { e.preventDefault(); });
    button.addEventListener('pointerup', clearHold); button.addEventListener('pointerleave', clearHold); button.addEventListener('pointercancel', clearHold);
  }
  setupHoldableButton(document.getElementById('rotLargeM'), ()=>{ cal.rot -= 5.0; updateLabels(); });
  setupHoldableButton(document.getElementById('rotLargeP'), ()=>{ cal.rot += 5.0; updateLabels(); });
  setupHoldableButton(document.getElementById('rotM'),      ()=>{ cal.rot -= 0.5; updateLabels(); });
  setupHoldableButton(document.getElementById('rotP'),      ()=>{ cal.rot += 0.5; updateLabels(); });
  setupHoldableButton(document.getElementById('cxLargeM'),  ()=>{ cal.cx -= 20; updateLabels(); });
  setupHoldableButton(document.getElementById('cxLargeP'),  ()=>{ cal.cx += 20; updateLabels(); });
  setupHoldableButton(document.getElementById('cxM'),       ()=>{ cal.cx -= 2; updateLabels(); });
  setupHoldableButton(document.getElementById('cxP'),       ()=>{ cal.cx += 2; updateLabels(); });
  setupHoldableButton(document.getElementById('cyLargeM'),  ()=>{ cal.cy -= 20; updateLabels(); });
  setupHoldableButton(document.getElementById('cyLargeP'),  ()=>{ cal.cy += 20; updateLabels(); });
  setupHoldableButton(document.getElementById('cyM'),       ()=>{ cal.cy -= 2; updateLabels(); });
  setupHoldableButton(document.getElementById('cyP'),       ()=>{ cal.cy += 2; updateLabels(); });
  setupHoldableButton(document.getElementById('rLargeM'),   ()=>{ cal.R_do *= 0.98; updateLabels(); });
  setupHoldableButton(document.getElementById('rLargeP'),   ()=>{ cal.R_do *= 1.02; updateLabels(); });
  setupHoldableButton(document.getElementById('rM'),        ()=>{ cal.R_do *= 0.998; updateLabels(); });
  setupHoldableButton(document.getElementById('rP'),        ()=>{ cal.R_do *= 1.002; updateLabels(); });
  saveCal.onclick = ()=>{ try{ localStorage.setItem(STORAGE, JSON.stringify(cal)); }catch{} };
  resetCal.onclick = ()=>{ cal = {...defaultCal}; try{ localStorage.removeItem(STORAGE); }catch{}; updateLabels(); };

  // --- Init ---
  refreshHUD();
  setMeter(powerFill, 0);
  setMeter(spinFill, .5, "#34d399", "#f59e0b");
})();
</script>
</body>
